apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: frontend-team
  namespace: argocd
spec:
  sourceRepos:
    - https://github.com/Manish0085/argocd--hands-on.git
  destinations:
    - namespace: frontend-taeam
      server: https://172.31.15.32:33893
  description: frontend application projects
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  roles:
    - name: frontend-admins
      description: Admin role for the frontend-team
      policies:
        - p, proj:frontend-team:frontend-admins, applications, *, frontend-team/*, allow
